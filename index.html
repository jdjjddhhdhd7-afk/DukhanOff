<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>دخان أوف 🚭</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#18202a;--muted:#697586;--primary:#1f8f5f;--primary2:#e7f7ee;--border:#e4e8ee;--danger:#c83b3b;--shadow:0 5px 18px #0000000d}*{box-sizing:border-box}body.dark{--bg:#10151b;--card:#171e26;--text:#f2f5f7;--muted:#9aa7b5;--primary:#55c98c;--primary2:#173a29;--border:#2b3540;--shadow:none}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Tahoma",sans-serif}button,input{font:inherit}#app{max-width:700px;margin:auto;min-height:100vh;padding-bottom:80px}.top{padding:20px 16px 10px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:24px;font-weight:800}.iconbtn{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:14px;padding:9px 12px}.screen{display:none;padding:10px 16px}.screen.active{display:block}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;margin:10px 0;box-shadow:var(--shadow)}.hero{background:linear-gradient(135deg,var(--primary2),var(--card))}.muted{color:var(--muted)}h1,h2,h3{margin:7px 0 10px}.big{font-size:40px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{padding:14px;border:1px solid var(--border);border-radius:15px;background:var(--card)}.label{font-size:13px;color:var(--muted)}.value{font-size:22px;font-weight:800;margin-top:5px}.row{display:flex;gap:9px;align-items:center}.row>*{flex:1}.btn{border:0;border-radius:14px;padding:13px 15px;font-weight:800;cursor:pointer;background:var(--primary);color:#fff}.btn.secondary{background:var(--primary2);color:var(--primary)}.btn.danger{background:#fff0f0;color:var(--danger);border:1px solid #ffd1d1}.input{width:100%;padding:13px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:13px;outline:none}.field{margin:10px 0}.field label{display:block;margin-bottom:6px;font-weight:700;font-size:14px}.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;justify-content:center;z-index:10}.navin{width:min(700px,100%);display:grid;grid-template-columns:repeat(5,1fr)}.nav button{border:0;background:none;color:var(--muted);padding:9px 3px 10px;font-size:11px}.nav button.active{color:var(--primary);font-weight:800}.nav .ni{font-size:20px;display:block}.progress{height:10px;background:var(--border);border-radius:10px;overflow:hidden}.bar{height:100%;background:var(--primary);border-radius:10px}.check{display:flex;justify-content:space-between;align-items:center}.badge{font-size:26px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.open{display:flex}.modalbox{max-width:430px;width:100%;background:var(--card);border-radius:20px;padding:20px}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;display:none;z-index:30}.empty{text-align:center;padding:30px 10px}.setup{padding:22px 16px}.small{font-size:12px}.chart{display:flex;align-items:end;gap:8px;height:160px;padding-top:15px}.col{flex:1;text-align:center}.vbar{width:100%;max-width:42px;margin:auto;background:var(--primary);border-radius:8px 8px 2px 2px;min-height:4px}.col span{font-size:10px;color:var(--muted);display:block;margin-top:5px}
</style></head><body><div id="app"></div><div class="toast" id="toast"></div>
<script>
const KEY='dukhanoff_user_state_v2';
const def={isConfigured:false,packPrice:500,packCount:20,baseline:20,dailyGoal:15,startDate:localDate(),darkMode:false,notifications:true,logs:{}};
let state=load();
function localDate(d=new Date()){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function load(){try{return {...def,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return {...def}}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function money(n){return Math.max(0,Math.round(n)).toLocaleString('ar-IQ')+' د.ع'}
function perCig(){return state.packCount>0?state.packPrice/state.packCount:0}
function log(day=localDate()){return state.logs[day]||0}
function setLog(day,n){state.logs[day]=Math.max(0,Math.round(n));save()}
function avoidedFor(day){return Math.max(0,state.baseline-log(day))}
function savedFor(day){return avoidedFor(day)*perCig()}
function daysBetween(a,b){return Math.max(0,Math.floor((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000))}
function sumRange(start,end){let s=0;for(let d=new Date(start+'T00:00:00');localDate(d)<=end;d.setDate(d.getDate()+1))s+=savedFor(localDate(d));return s}
function totalAvoided(){return Object.keys(state.logs).reduce((s,d)=>s+avoidedFor(d),0)}
function showToast(t){const x=document.getElementById('toast');x.textContent=t;x.style.display='block';clearTimeout(showToast.t);showToast.t=setTimeout(()=>x.style.display='none',1800)}
function render(){document.body.classList.toggle('dark',state.darkMode);if(!state.isConfigured){renderSetup();return}renderShell()}
function renderSetup(){document.getElementById('app').innerHTML=`<div class="setup"><div class="card hero"><div style="font-size:48px">🚭</div><h1>دخان أوف</h1><p class="muted">ساعد نفسك تقلل التدخين خطوة بخطوة، وتعرف شكد وفرت من فلوسك.</p></div><div class="card"><h2>ابدأ خطتك</h2><div class="field"><label>سعر الباكيت</label><input class="input" id="packPrice" type="number" value="${state.packPrice}" placeholder="مثال: 500"></div><div class="field"><label>عدد السكاير بالباكيت</label><input class="input" id="packCount" type="number" value="${state.packCount}" placeholder="مثال: 20"></div><div class="field"><label>كم سيجارة تدخن باليوم؟</label><input class="input" id="baseline" type="number" value="${state.baseline}" placeholder="مثال: 20"></div><div class="field"><label>هدفك اليومي</label><input class="input" id="goal" type="number" value="${state.dailyGoal}" placeholder="مثال: 15"></div><button class="btn" onclick="startApp()">ابدأ 🚭</button></div><p class="muted small">بياناتك تُحفظ محلياً على الجهاز. التطبيق للتوعية والمساعدة وليس بديلاً عن الطبيب.</p></div>`}
function startApp(){const pp=+document.getElementById('packPrice').value,pc=+document.getElementById('packCount').value,b=+document.getElementById('baseline').value,g=+document.getElementById('goal').value;if(pp<=0||pc<=0||b<=0||g<0||g>b){showToast('تأكد من الأرقام والهدف');return}state={...state,isConfigured:true,packPrice:pp,packCount:pc,baseline:b,dailyGoal:g,startDate:localDate()};save();render()}
function renderShell(){document.getElementById('app').innerHTML=`<div class="top"><div class="brand">دخان أوف 🚭</div><button class="iconbtn" onclick="toggleTheme()">${state.darkMode?'☀️':'🌙'}</button></div><main id="content"></main><div class="nav"><div class="navin"><button data-s="home" onclick="go('home')"><span class="ni">🏠</span>الرئيسية</button><button data-s="plan" onclick="go('plan')"><span class="ni">🎯</span>خطتي</button><button data-s="stats" onclick="go('stats')"><span class="ni">📊</span>الإحصائيات</button><button data-s="ach" onclick="go('ach')"><span class="ni">🏆</span>إنجازاتي</button><button data-s="settings" onclick="go('settings')"><span class="ni">⚙️</span>الإعدادات</button></div></div>`;go('home')}
function go(s){const c=document.getElementById('content');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.s===s));if(s==='home')home(c);if(s==='plan')plan(c);if(s==='stats')stats(c);if(s==='ach')ach(c);if(s==='settings')settings(c);scrollTo(0,0)}
function home(c){const today=localDate(),smoked=log(today),remaining=Math.max(0,state.dailyGoal-smoked),avoided=avoidedFor(today),saved=savedFor(today),pct=Math.min(100,state.dailyGoal?smoked/state.dailyGoal*100:0),baseDaily=state.baseline*perCig();c.innerHTML=`<section class="screen active"><div class="card hero"><div class="muted">هدفك اليومي</div><div class="big">${state.dailyGoal} 🚬</div><div class="progress"><div class="bar" style="width:${pct}%"></div></div><p>${smoked} مدخنة اليوم • ${remaining} متبقية ضمن الهدف</p><div class="row"><button class="btn" onclick="addCig()">+ سجل سيجارة</button><button class="btn secondary" onclick="undoCig()">− تراجع</button></div></div><div class="grid"><div class="stat"><div class="label">لم تدخن</div><div class="value">${avoided}</div></div><div class="stat"><div class="label">وفرت اليوم</div><div class="value">${money(saved)}</div></div><div class="stat"><div class="label">صرفك قبل الخطة / يوم</div><div class="value">${money(baseDaily)}</div></div><div class="stat"><div class="label">الباكيت</div><div class="value">${money(state.packPrice)}</div><div class="small muted">${state.packCount} سيجارة</div></div></div><div class="card"><h3>مصاريف خط الأساس</h3><div class="grid"><div class="stat"><div class="label">يومياً</div><div class="value">${money(baseDaily)}</div></div><div class="stat"><div class="label">أسبوعياً</div><div class="value">${money(baseDaily*7)}</div></div><div class="stat"><div class="label">شهرياً</div><div class="value">${money(baseDaily*30)}</div></div><div class="stat"><div class="label">سنوياً</div><div class="value">${money(baseDaily*365)}</div></div></div></div></section>`}
function addCig(){const d=localDate();setLog(d,log(d)+1);render();showToast('تم تسجيل سيجارة')}
function undoCig(){const d=localDate();setLog(d,Math.max(0,log(d)-1));render()}
function plan(c){c.innerHTML=`<section class="screen active"><div class="card"><h2>🎯 خطتي</h2><p class="muted">حدد الحد اليومي الذي تريد الوصول له.</p><div class="field"><label>الهدف اليومي</label><input class="input" id="newGoal" type="number" min="0" max="${state.baseline}" value="${state.dailyGoal}"></div><button class="btn" onclick="saveGoal()">حفظ الهدف</button></div><div class="card"><h3>أهداف مقترحة</h3><div class="grid">${[Math.max(0,state.baseline-5),Math.max(0,state.baseline-8),Math.max(0,state.baseline-10),Math.max(0,state.baseline-13)].filter((v,i,a)=>a.indexOf(v)===i).map(v=>`<button class="btn secondary" onclick="quickGoal(${v})">${v} سيجارة</button>`).join('')}</div></div><div class="card"><h3>نصيحة</h3><p class="muted">إذا كان تقليل العدد صعباً، ثبت هدفك عدة أيام ثم قلله تدريجياً.</p></div></section>`}
function saveGoal(){const g=+document.getElementById('newGoal').value;if(g<0||g>state.baseline){showToast('الهدف لازم يكون بين 0 وخط الأساس');return}state.dailyGoal=g;save();render();go('plan');showToast('تم حفظ الهدف')}
function quickGoal(g){state.dailyGoal=g;save();render();go('plan');showToast('تم تغيير الهدف')}
function stats(c){const end=localDate(),start=new Date();start.setDate(start.getDate()-6);const st=localDate(start);let total=totalAvoided(),rate=state.baseline?Math.min(100,total/(Math.max(1,Object.keys(state.logs).length)*state.baseline)*100):0;let week=sumRange(st,end),monthStart=new Date();monthStart.setDate(1);let month=sumRange(localDate(monthStart),end);let bars=[];for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let ds=localDate(d);bars.push({d:ds,n:log(ds)})}let max=Math.max(state.baseline,...bars.map(x=>x.n),1);c.innerHTML=`<section class="screen active"><div class="card"><h2>📊 الإحصائيات</h2><div class="grid"><div class="stat"><div class="label">أيام مسجلة</div><div class="value">${Object.keys(state.logs).length}</div></div><div class="stat"><div class="label">إجمالي السكاير التي لم تُدخن</div><div class="value">${total}</div></div><div class="stat"><div class="label">التوفير هذا الأسبوع</div><div class="value">${money(week)}</div></div><div class="stat"><div class="label">التوفير هذا الشهر</div><div class="value">${money(month)}</div></div></div><p>نسبة الخفض في الأيام المسجلة: <b>${Math.round(rate)}%</b></p></div><div class="card"><h3>آخر 7 أيام</h3><div class="chart">${bars.map(x=>`<div class="col"><div class="vbar" style="height:${Math.max(6,x.n/max*120)}px"></div><span>${x.d.slice(5)}</span><span>${x.n}</span></div>`).join('')}</div></div></section>`}
function ach(c){const total=totalAvoided(),saved=sumRange(state.startDate,localDate()),days=Object.keys(state.logs).filter(d=>log(d)<=state.dailyGoal).length;const list=[['🚭','أول يوم','سجلت أول يوم',Object.keys(state.logs).length>=1],['🌱','10 سكاير','لم تدخن 10 سكاير مقارنة بخط الأساس',total>=10],['🔥','50 سيجارة','لم تدخن 50 سيجارة',total>=50],['🏆','100 سيجارة','لم تدخن 100 سيجارة',total>=100],['💰','10,000 د.ع','وفرت 10 آلاف دينار',saved>=10000],['💎','50,000 د.ع','وفرت 50 ألف دينار',saved>=50000],['📅','7 أيام','حققت هدفك في 7 أيام مسجلة',days>=7]];c.innerHTML=`<section class="screen active"><div class="card"><h2>🏆 إنجازاتي</h2><p class="muted">كل تقدم، حتى لو بسيط، ينحسب.</p></div>${list.map(x=>`<div class="card check" style="opacity:${x[3]?1:.48}"><div class="row" style="justify-content:flex-start"><div class="badge">${x[0]}</div><div><b>${x[1]}</b><div class="small muted">${x[2]}</div></div></div><div>${x[3]?'✅':'🔒'}</div></div>`).join('')}</section>`}
function settings(c){c.innerHTML=`<section class="screen active"><div class="card"><h2>⚙️ الإعدادات</h2><div class="field"><label>سعر الباكيت</label><input class="input" id="sPrice" type="number" value="${state.packPrice}"></div><div class="field"><label>عدد السكاير بالباكيت</label><input class="input" id="sCount" type="number" value="${state.packCount}"></div><div class="field"><label>خط الأساس — السكاير يومياً</label><input class="input" id="sBase" type="number" value="${state.baseline}"></div><button class="btn" onclick="saveSettings()">حفظ</button></div><div class="card check"><div><b>🔔 التذكيرات</b><div class="small muted">حفظ الإعداد فقط حالياً</div></div><button class="btn secondary" onclick="toggleNotify()">${state.notifications?'مفعلة':'متوقفة'}</button></div><div class="card"><h3>🌙 المظهر</h3><button class="btn secondary" onclick="toggleTheme()">${state.darkMode?'استخدام الوضع الفاتح':'استخدام الوضع الداكن'}</button></div><div class="card"><h3>ℹ️ تنبيه صحي</h3><p class="muted small">هذا التطبيق أداة مساعدة للتقليل أو الإقلاع عن التدخين ولا يقدم تشخيصاً أو علاجاً طبياً. إذا احتجت مساعدة صحية، تحدث مع طبيب أو مختص.</p></div><div class="card"><button class="btn danger" onclick="openReset()">حذف كل البيانات</button></div></section>`}
function saveSettings(){const pp=+document.getElementById('sPrice').value,pc=+document.getElementById('sCount').value,b=+document.getElementById('sBase').value;if(pp<=0||pc<=0||b<=0){showToast('تأكد من الأرقام');return}state.packPrice=pp;state.packCount=pc;state.baseline=b;if(state.dailyGoal>b)state.dailyGoal=b;save();render();go('settings');showToast('تم الحفظ')}
function toggleNotify(){state.notifications=!state.notifications;save();render();go('settings')}
function toggleTheme(){state.darkMode=!state.darkMode;save();render()}
function openReset(){document.body.insertAdjacentHTML('beforeend',`<div class="modal open" id="resetModal"><div class="modalbox"><h3>حذف كل البيانات؟</h3><p class="muted">سيتم حذف الخطة والسجلات من هذا الجهاز.</p><div class="row"><button class="btn danger" onclick="resetAll()">حذف</button><button class="btn secondary" onclick="document.getElementById('resetModal').remove()">إلغاء</button></div></div></div>`)}
function resetAll(){localStorage.removeItem(KEY);state={...def,startDate:localDate()};document.getElementById('resetModal')?.remove();render();showToast('تم حذف البيانات')}
render();
</script></body></html>
